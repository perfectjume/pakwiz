name: CORE UI 0.3.13 GL State Cache Fix

on:
  workflow_dispatch:
  push:
    branches:
      - core-ui-runtime-smoke
    paths:
      - '.github/workflows/core-ui-0313-cache-fix.yml'

permissions:
  contents: read

jobs:
  build-cache-fix:
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - name: Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Reconstruct exact tested bridge
        run: |
          set -euo pipefail
          cat core-ui-runtime/core_ui_bridge-0.3.11.jar.b64.part* | base64 -d > core_ui_bridge-base.jar
          unzip -t core_ui_bridge-base.jar
          sha256sum core_ui_bridge-base.jar

      - name: Prepare NeoForge 1.21.1 compile environment
        run: |
          set -euo pipefail
          git clone --depth 1 https://github.com/NeoForgeMDKs/MDK-1.21.1-ModDevGradle.git mdk
          cd mdk
          sed -i 's/^neo_version=.*/neo_version=21.1.250/' gradle.properties
          sed -i 's/^mod_id=.*/mod_id=coreuicachefix/' gradle.properties
          sed -i 's/^mod_name=.*/mod_name=CORE UI Cache Fix Build/' gradle.properties
          sed -i 's/^mod_version=.*/mod_version=0.3.13/' gradle.properties
          sed -i 's/^mod_group_id=.*/mod_group_id=dev.coreui.cachefix/' gradle.properties

          mkdir -p libs src/main/java/dev/coreui/bridge
          cp ../core_ui_bridge-base.jar libs/
          sed -i '/dependencies {/a\    compileOnly files("libs/core_ui_bridge-base.jar")' build.gradle

          curl -fL -o ../cfr-0.152.jar https://github.com/leibnitz27/cfr/releases/download/0.152/cfr-0.152.jar
          rm -rf ../decompiled
          mkdir -p ../decompiled
          java -jar ../cfr-0.152.jar ../core_ui_bridge-base.jar --outputdir ../decompiled --silent true
          cp ../decompiled/dev/coreui/bridge/GpuInterop.java src/main/java/dev/coreui/bridge/GpuInterop.java

      - name: Apply Minecraft GL-state-cache synchronization fix
        run: |
          set -euo pipefail
          cd mdk
          python3 - <<'PY'
          from pathlib import Path

          p = Path("src/main/java/dev/coreui/bridge/GpuInterop.java")
          s = p.read_text()

          replacements = {
              "GL11.glGenTextures()":
                  "com.mojang.blaze3d.platform.GlStateManager._genTexture()",
              "GL11.glBindTexture((int)3553, (int)this.glTexture)":
                  "com.mojang.blaze3d.platform.GlStateManager._bindTexture(this.glTexture)",
              "GL11.glBindTexture((int)3553, (int)0)":
                  "com.mojang.blaze3d.platform.GlStateManager._bindTexture(0)",
              "GL11.glDeleteTextures((int)this.glTexture)":
                  "com.mojang.blaze3d.platform.GlStateManager._deleteTexture(this.glTexture)",
          }

          # CFR formatting can omit redundant casts. Accept exactly one of the
          # observed equivalent spellings for bind/delete, but never silently
          # continue when a target is absent.
          alternatives = [
              (
                  [
                      "GL11.glBindTexture((int)3553, (int)this.glTexture)",
                      "GL11.glBindTexture(3553, this.glTexture)",
                  ],
                  "com.mojang.blaze3d.platform.GlStateManager._bindTexture(this.glTexture)",
                  "bind-owned"
              ),
              (
                  [
                      "GL11.glBindTexture((int)3553, (int)0)",
                      "GL11.glBindTexture(3553, 0)",
                  ],
                  "com.mojang.blaze3d.platform.GlStateManager._bindTexture(0)",
                  "unbind-owned"
              ),
              (
                  [
                      "GL11.glDeleteTextures((int)this.glTexture)",
                      "GL11.glDeleteTextures(this.glTexture)",
                  ],
                  "com.mojang.blaze3d.platform.GlStateManager._deleteTexture(this.glTexture)",
                  "delete-owned"
              ),
          ]

          if "GL11.glGenTextures()" not in s:
              raise SystemExit("GL_GEN_TEXTURES_TARGET_NOT_FOUND")
          s = s.replace(
              "GL11.glGenTextures()",
              "com.mojang.blaze3d.platform.GlStateManager._genTexture()",
              1
          )

          for needles, repl, label in alternatives:
              matched = [n for n in needles if n in s]
              if len(matched) != 1:
                  raise SystemExit(f"{label.upper()}_TARGET_COUNT={len(matched)}")
              s = s.replace(matched[0], repl, 1)

          p.write_text(s)

          print("GL_STATE_CACHE_FIX=APPLIED")
          for marker in [
              "GlStateManager._genTexture()",
              "GlStateManager._bindTexture(this.glTexture)",
              "GlStateManager._bindTexture(0)",
              "GlStateManager._deleteTexture(this.glTexture)",
          ]:
              if marker not in s:
                  raise SystemExit("MISSING_PATCH_MARKER " + marker)
              print("PATCH_MARKER", marker)
          PY

          grep -n 'GlStateManager' src/main/java/dev/coreui/bridge/GpuInterop.java

      - name: Compile exact GpuInterop replacement
        run: |
          set -euo pipefail
          cd mdk
          chmod +x gradlew
          ./gradlew --no-daemon compileJava
          test -f build/classes/java/main/dev/coreui/bridge/GpuInterop.class
          javap -classpath build/classes/java/main -c -p dev.coreui.bridge.GpuInterop > ../GpuInterop-cache-fixed.javap.txt

          grep -F 'GlStateManager._genTexture' ../GpuInterop-cache-fixed.javap.txt
          grep -F 'GlStateManager._bindTexture' ../GpuInterop-cache-fixed.javap.txt
          grep -F 'GlStateManager._deleteTexture' ../GpuInterop-cache-fixed.javap.txt

          mkdir -p ../patched/dev/coreui/bridge
          cp build/classes/java/main/dev/coreui/bridge/GpuInterop.class ../patched/dev/coreui/bridge/
          cp ../core_ui_bridge-base.jar ../core_ui_bridge-cache-fixed.jar
          (cd ../patched && zip -q -u ../core_ui_bridge-cache-fixed.jar dev/coreui/bridge/GpuInterop.class)
          unzip -t ../core_ui_bridge-cache-fixed.jar
          sha256sum ../core_ui_bridge-cache-fixed.jar | tee ../cache-fixed-jar-sha256.txt

      - name: Upload cache-fix build evidence
        uses: actions/upload-artifact@v4
        with:
          name: core-ui-0313-cache-fix-build
          if-no-files-found: error
          path: |
            core_ui_bridge-cache-fixed.jar
            cache-fixed-jar-sha256.txt
            GpuInterop-cache-fixed.javap.txt
            mdk/src/main/java/dev/coreui/bridge/GpuInterop.java
            mdk/build/classes/java/main/dev/coreui/bridge/GpuInterop.class
