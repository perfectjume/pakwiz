name: ChatGPT Aeronautics Exact Relay

on:
  push:
    branches:
      - chatgpt-aero-relay-2

permissions:
  contents: read

jobs:
  relay:
    runs-on: ubuntu-latest
    steps:
      - name: Download and verify exact Aeronautics 1.3.0
        shell: bash
        run: |
          set -euo pipefail
          file="create-aeronautics-bundled-1.21.1-1.3.0.jar"
          url="https://cdn.modrinth.com/data/oWaK0Q19/versions/w7zlLnea/$file"
          curl --fail --location --retry 5 --retry-all-errors --output "$file" "$url"
          test "$(stat -c %s "$file")" = "33120013"
          echo "a2b08963ebc9f331f52c626aebcd65013e100d69  $file" | sha1sum -c -
          echo "2abba2e166a0ec8d42ab06108b63070d61f985420ecca8739c5b2300561b31486b69b3ad13310b0c459edb9edebeffb55a4cdf4ce493805833d32f5bde9ce778  $file" | sha512sum -c -
      - name: Upload verified exact JAR
        uses: actions/upload-artifact@v4
        with:
          name: aeronautics-1.3.0-exact
          path: create-aeronautics-bundled-1.21.1-1.3.0.jar
          if-no-files-found: error
          compression-level: 0
          retention-days: 1
