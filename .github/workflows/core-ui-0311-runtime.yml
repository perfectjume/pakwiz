name: CORE UI 0.3.11 Public In-Game Runtime

on:
  push:
    branches:
      - core-ui-runtime-smoke
    paths:
      - '.github/workflows/core-ui-0311-runtime.yml'

permissions:
  contents: read

jobs:
  ingame-runtime:
    runs-on: ubuntu-24.04
    timeout-minutes: 35

    steps:
      - uses: actions/checkout@v4
        with:
          ref: core-ui-runtime-smoke

      - name: Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Install virtual display
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb openbox mesa-utils

      - name: Reconstruct exact 0.3.11 bridge
        run: |
          set -euo pipefail
          cat core-ui-runtime/core_ui_bridge-0.3.11.jar.b64.part* | base64 -d > core_ui_bridge-0.3.11.jar
          echo 'f398fe1340145c0c4be8a627b4d555729126231d9d61edea7849e6962c9b8a66  core_ui_bridge-0.3.11.jar' | sha256sum -c -
          unzip -t core_ui_bridge-0.3.11.jar
          unzip -p core_ui_bridge-0.3.11.jar META-INF/neoforge.mods.toml | tee core-ui-mod-metadata.txt
          grep -F 'version="0.3.11"' core-ui-mod-metadata.txt
          grep -F 'versionRange="[21.1.250,21.2)"' core-ui-mod-metadata.txt

      - name: Prepare NeoForge 1.21.1 client runtime
        run: |
          set -euo pipefail
          git clone --depth 1 https://github.com/NeoForgeMDKs/MDK-1.21.1-ModDevGradle.git mdk
          cd mdk
          sed -i 's/^neo_version=.*/neo_version=21.1.250/' gradle.properties
          sed -i 's/^mod_id=.*/mod_id=coreuiruntimetest/' gradle.properties
          sed -i 's/^mod_name=.*/mod_name=CORE UI Runtime Test/' gradle.properties
          sed -i 's/^mod_version=.*/mod_version=1.0.0/' gradle.properties
          sed -i 's/^mod_group_id=.*/mod_group_id=com.example.coreuiruntime/' gradle.properties
          python3 - <<'PY'
          from pathlib import Path
          p = Path("build.gradle")
          s = p.read_text()
          needle = "        client()\n"
          if needle not in s:
              raise SystemExit("CLIENT_RUN_BLOCK_NOT_FOUND")
          s = s.replace(
              needle,
              needle + "        programArguments.addAll '--quickPlaySingleplayer', 'CORE_UI_TEST_WORLD', '--width', '854', '--height', '480'\n",
              1,
          )
          p.write_text(s)
          PY
          rm -rf src/main/java/com/example/examplemod
          mkdir -p src/main/java/com/example/coreuiruntime libs run/mods
          cp ../core_ui_bridge-0.3.11.jar libs/
          sed -i '/dependencies {/a\    compileOnly files("libs/core_ui_bridge-0.3.11.jar")' build.gradle

          # Decompile the exact packaged overlay, then move pause-session startup
          # from added() to init(), where Screen.init(Minecraft, w, h) has supplied
          # the Minecraft instance. Keep all other overlay behavior unchanged.
          mkdir -p src/main/java/dev/coreui/bridge
          curl -fL -o ../cfr-0.152.jar https://github.com/leibnitz27/cfr/releases/download/0.152/cfr-0.152.jar
          rm -rf ../decompiled-overlay
          mkdir -p ../decompiled-overlay
          java -jar ../cfr-0.152.jar ../core_ui_bridge-0.3.11.jar --outputdir ../decompiled-overlay --silent true
          test -f ../decompiled-overlay/dev/coreui/bridge/GpuOverlayScreen.java
          cp ../decompiled-overlay/dev/coreui/bridge/GpuOverlayScreen.java src/main/java/dev/coreui/bridge/GpuOverlayScreen.java

          python3 - <<'PY'
          from pathlib import Path

          p = Path("src/main/java/dev/coreui/bridge/GpuOverlayScreen.java")
          s = p.read_text()

          signature = "    public void added() {"
          start = s.find(signature)
          if start < 0:
              raise SystemExit("GPU_OVERLAY_ADDED_METHOD_NOT_FOUND")

          brace = s.find("{", start)
          depth = 0
          end = None
          for i in range(brace, len(s)):
              ch = s[i]
              if ch == "{":
                  depth += 1
              elif ch == "}":
                  depth -= 1
                  if depth == 0:
                      end = i + 1
                      break
          if end is None:
              raise SystemExit("GPU_OVERLAY_ADDED_METHOD_END_NOT_FOUND")

          replacement = """    public void added() {
              this.openedAtNanos = System.nanoTime();
              this.pointerSyncPending = true;
              this.viewportFrameReady = false;
              this.currentViewportImportAttempted = false;
              this.readyGeneration = 0L;
              this.lastReportedGpuError = null;
          }

          @Override
          protected void init() {
              if (this.sessionId == 0L && this.minecraft != null) {
                  this.lastPixelWidth = this.minecraft.getWindow().getWidth();
                  this.lastPixelHeight = this.minecraft.getWindow().getHeight();
                  this.sessionId = BridgeRuntime.beginPauseSession(this.lastPixelWidth, this.lastPixelHeight);
                  BridgeRuntime.trace("overlay-init begin-pause session=" + this.sessionId + " px=" + this.lastPixelWidth + "x" + this.lastPixelHeight);
              }
          }"""

          s = s[:start] + replacement + s[end:]

          # CFR can merge different JVM local-slot types. In this class the same
          # slot is used first for importFrame(boolean), later for beginDraw(int).
          # Split only the decompiler-created Java variable so source recompiles
          # without changing the original control flow.
          import re
          m = re.search(r'(?m)^(\\s*)([A-Za-z_$][A-Za-z0-9_$]*)\\s*=\\s*this\\.gpu\\.importFrame\\(frameDescriptor\\);', s)
          if not m:
              raise SystemExit("GPU_OVERLAY_IMPORTFRAME_ASSIGNMENT_NOT_FOUND")
          oldvar = m.group(2)
          draw_marker = oldvar + " = this.gpu.beginDraw();"
          draw_pos = s.find(draw_marker, m.end())
          if draw_pos < 0:
              raise SystemExit("GPU_OVERLAY_BEGINDRAW_ASSIGNMENT_NOT_FOUND")
          segment = s[m.start():draw_pos]
          segment = re.sub(r'\\b' + re.escape(oldvar) + r'\\b', 'importOk', segment)
          segment = segment.replace("importOk = this.gpu.importFrame(frameDescriptor);",
                                    "boolean importOk = this.gpu.importFrame(frameDescriptor);", 1)
          s = s[:m.start()] + segment + s[draw_pos:]

          p.write_text(s)
          print("GPU_OVERLAY_LIFECYCLE_PATCH=APPLIED")
          print("GPU_OVERLAY_CFR_SLOT_SPLIT=APPLIED")
          PY

          grep -F 'protected void init()' src/main/java/dev/coreui/bridge/GpuOverlayScreen.java
          grep -F 'overlay-init begin-pause session=' src/main/java/dev/coreui/bridge/GpuOverlayScreen.java

          mkdir -p src/main/java/dev/coreui/bridge
          cat > src/main/java/dev/coreui/bridge/CoreUiBridge.java <<'JAVA'
          package dev.coreui.bridge;

          import net.minecraft.client.gui.screens.PauseScreen;
          import net.minecraft.client.gui.screens.Screen;
          import net.neoforged.api.distmarker.Dist;
          import net.neoforged.fml.common.Mod;
          import net.neoforged.neoforge.client.event.ScreenEvent;
          import net.neoforged.neoforge.common.NeoForge;

          @Mod(value = CoreUiBridge.MOD_ID, dist = Dist.CLIENT)
          public final class CoreUiBridge {
              public static final String MOD_ID = "core_ui_bridge";

              public CoreUiBridge() {
                  BridgeRuntime.start();
                  NeoForge.EVENT_BUS.addListener(this::onScreenOpening);
              }

              private void onScreenOpening(ScreenEvent.Opening event) {
                  Screen next = event.getNewScreen();
                  boolean connected = BridgeRuntime.isConnected();
                  BridgeRuntime.trace("screen-opening new=" + (next == null ? "null" : next.getClass().getName()) + " connected=" + connected);
                  if (!connected) {
                      BridgeRuntime.trace("screen-opening passthrough reason=transport-disconnected");
                      return;
                  }
                  if (next instanceof PauseScreen pause) {
                      boolean showsPauseMenu = pause.showsPauseMenu();
                      BridgeRuntime.trace("pause-screen-detected showsPauseMenu=" + showsPauseMenu);
                      if (showsPauseMenu) {
                          event.setNewScreen(new GpuOverlayScreen());
                          BridgeRuntime.trace("pause-screen-replaced-with-gpu-overlay");
                      }
                  }
              }
          }
          JAVA

          cat > src/main/java/com/example/coreuiruntime/CoreUiRuntimeTest.java <<'JAVA'
          package com.example.coreuiruntime;

          import net.minecraft.client.Minecraft;
          import net.minecraft.client.gui.screens.PauseScreen;
          import net.minecraft.client.gui.screens.Screen;
          import net.neoforged.api.distmarker.Dist;
          import net.neoforged.fml.ModList;
          import net.neoforged.fml.common.Mod;
          import net.neoforged.neoforge.client.event.ClientTickEvent;
          import net.neoforged.neoforge.common.NeoForge;

          import java.nio.file.Files;
          import java.nio.file.Path;
          import java.nio.file.StandardOpenOption;

          @Mod(value = CoreUiRuntimeTest.MOD_ID, dist = Dist.CLIENT)
          public final class CoreUiRuntimeTest {
              public static final String MOD_ID = "coreuiruntimetest";
              private int ticks;
              private int phase;
              private int phaseTicks;
              private int cycles;
              private boolean sawInGame;

              public CoreUiRuntimeTest() {
                  NeoForge.EVENT_BUS.addListener(this::onTick);
                  trace("TEST_MOD_CONSTRUCTED");
              }

              private static boolean overlay(Minecraft mc) {
                  return mc.screen != null
                          && mc.screen.getClass().getName().equals("dev.coreui.bridge.GpuOverlayScreen");
              }

              private void onTick(ClientTickEvent.Post event) {
                  try {
                      Minecraft mc = Minecraft.getInstance();
                      ticks++;

                      if (ticks == 20) {
                          boolean loaded = ModList.get().isLoaded("core_ui_bridge");
                          trace("CORE_UI_LOADED=" + loaded);
                          if (!loaded) fail(mc, "CORE_UI_NOT_LOADED");
                      }

                      if (phase == 0) {
                          if (mc.level != null && mc.player != null) {
                              if (!sawInGame) {
                                  sawInGame = true;
                                  trace("IN_GAME=true");
                                  trace("PLAYER=" + mc.player.getGameProfile().getName());
                              }
                              phaseTicks++;
                              if (phaseTicks >= 40 && mc.screen == null) {
                                  phase = 1;
                                  phaseTicks = 0;
                              }
                          } else if (ticks > 3600) {
                              fail(mc, "IN_GAME_TIMEOUT");
                          }
                          return;
                      }

                      if (phase == 1) {
                          phaseTicks++;
                          if (phaseTicks < 8) return;
                          int next = cycles + 1;
                          trace("OPEN_PAUSE_CYCLE=" + next);
                          mc.setScreen(new PauseScreen(true));
                          Screen now = mc.screen;
                          trace("AFTER_PAUSE_OPEN=" + (now == null ? "null" : now.getClass().getName()));
                          if (!overlay(mc)) {
                              fail(mc, "OVERLAY_REPLACEMENT_FAILED_CYCLE_" + next);
                              return;
                          }
                          cycles = next;
                          trace("OVERLAY_REPLACEMENT_PASS_CYCLE=" + cycles);
                          phaseTicks = 0;
                          phase = cycles <= 10 ? 2 : 4;
                          return;
                      }

                      if (phase == 2) {
                          phaseTicks++;
                          if (!overlay(mc)) {
                              fail(mc, "OVERLAY_DISAPPEARED_CYCLE_" + cycles);
                              return;
                          }
                          if (phaseTicks >= 8) {
                              mc.setScreen(null);
                              trace("CLOSE_PAUSE_CYCLE=" + cycles);
                              phase = 3;
                              phaseTicks = 0;
                          }
                          return;
                      }

                      if (phase == 3) {
                          phaseTicks++;
                          if (mc.screen != null) {
                              fail(mc, "SCREEN_NOT_CLOSED_CYCLE_" + cycles);
                              return;
                          }
                          if (phaseTicks >= 8) {
                              phase = 1;
                              phaseTicks = 0;
                          }
                          return;
                      }

                      if (phase == 4) {
                          phaseTicks++;
                          if (!overlay(mc)) {
                              fail(mc, "OVERLAY_DISAPPEARED_BEFORE_FULLSCREEN");
                              return;
                          }
                          if (phaseTicks == 20) {
                              trace("PRE_FULLSCREEN=" + mc.getWindow().isFullscreen());
                              mc.getWindow().toggleFullScreen();
                              phase = 5;
                              phaseTicks = 0;
                          }
                          return;
                      }

                      if (phase == 5) {
                          phaseTicks++;
                          if (!overlay(mc)) {
                              fail(mc, "OVERLAY_DISAPPEARED_IN_FULLSCREEN");
                              return;
                          }
                          if (phaseTicks == 60) {
                              trace("POST_FULLSCREEN=" + mc.getWindow().isFullscreen());
                              trace("FULLSCREEN_OVERLAY_SURVIVED=PASS");
                              mc.getWindow().toggleFullScreen();
                              phase = 6;
                              phaseTicks = 0;
                          }
                          return;
                      }

                      if (phase == 6) {
                          phaseTicks++;
                          if (!overlay(mc)) {
                              fail(mc, "OVERLAY_DISAPPEARED_AFTER_FULLSCREEN_EXIT");
                              return;
                          }
                          if (phaseTicks == 60) {
                              trace("POST_WINDOWED=" + mc.getWindow().isFullscreen());
                              trace("WINDOWED_OVERLAY_SURVIVED=PASS");
                              mc.setScreen(null);
                              trace("TOTAL_PAUSE_CYCLES=" + cycles);
                              trace("CLIENT_RUNTIME_TEST_RESULT PASS");
                              phase = 99;
                              mc.stop();
                          }
                      }
                  } catch (Throwable t) {
                      trace("EXCEPTION=" + t.getClass().getName() + ":" + String.valueOf(t.getMessage()));
                      t.printStackTrace();
                      try { Minecraft.getInstance().stop(); } catch (Throwable ignored) {}
                      phase = 99;
                  }
              }

              private static void fail(Minecraft mc, String reason) {
                  trace("CLIENT_RUNTIME_TEST_RESULT FAIL " + reason);
                  try { mc.stop(); } catch (Throwable ignored) {}
              }

              private static synchronized void trace(String s) {
                  System.out.println("[CORE-UI-TEST] " + s);
                  try {
                      Files.writeString(
                          Path.of("CORE_UI_RUNTIME_TRACE.txt"),
                          s + System.lineSeparator(),
                          StandardOpenOption.CREATE,
                          StandardOpenOption.APPEND
                      );
                  } catch (Exception e) {
                      throw new RuntimeException(e);
                  }
              }
          }
          JAVA

          chmod +x gradlew
          ./gradlew --no-daemon compileJava

          # Patch CoreUiBridge.class and GpuOverlayScreen.class, both compiled
          # against the real NeoForge 21.1.250 / Minecraft 1.21.1 classpath.
          {
            echo '=== CoreUiBridge ==='
            javap -classpath build/classes/java/main -verbose dev.coreui.bridge.CoreUiBridge
            echo '=== GpuOverlayScreen ==='
            javap -classpath build/classes/java/main -c -p dev.coreui.bridge.GpuOverlayScreen
          } | tee ../core-ui-fixed-bytecode.txt
          grep -F 'NeoForge.EVENT_BUS:Lnet/neoforged/bus/api/IEventBus;' ../core-ui-fixed-bytecode.txt
          grep -F 'BridgeRuntime.beginPauseSession' ../core-ui-fixed-bytecode.txt
          grep -F 'protected void init();' ../core-ui-fixed-bytecode.txt

          mkdir -p ../api-fix/dev/coreui/bridge
          cp build/classes/java/main/dev/coreui/bridge/CoreUiBridge.class ../api-fix/dev/coreui/bridge/
          cp build/classes/java/main/dev/coreui/bridge/GpuOverlayScreen.class ../api-fix/dev/coreui/bridge/
          (cd ../api-fix && zip -q -u ../core_ui_bridge-0.3.11.jar dev/coreui/bridge/CoreUiBridge.class dev/coreui/bridge/GpuOverlayScreen.class)
          unzip -t ../core_ui_bridge-0.3.11.jar
          sha256sum ../core_ui_bridge-0.3.11.jar | tee ../fixed-jar-sha256.txt

          # Do not let helper copies shadow the actual patched mod JAR at runtime.
          rm -f src/main/java/dev/coreui/bridge/CoreUiBridge.java
          rm -f src/main/java/dev/coreui/bridge/GpuOverlayScreen.java
          rm -f build/classes/java/main/dev/coreui/bridge/CoreUiBridge.class
          rm -f build/classes/java/main/dev/coreui/bridge/GpuOverlayScreen.class
          cp ../core_ui_bridge-0.3.11.jar libs/core_ui_bridge-0.3.11.jar

      - name: Generate a real playable world
        run: |
          set -euo pipefail
          cd mdk
          rm -f run/mods/core_ui_bridge-0.3.11.jar
          mkdir -p run
          echo 'eula=true' > run/eula.txt

          cat > ../prepare_world.py <<'PY'
          import subprocess, sys, time
          cmd = ["./gradlew", "--no-daemon", "runServer", "--console=plain"]
          with open("../server-console.log", "w", buffering=1) as log:
              p = subprocess.Popen(
                  cmd,
                  stdin=subprocess.PIPE,
                  stdout=subprocess.PIPE,
                  stderr=subprocess.STDOUT,
                  text=True,
                  bufsize=1,
                  start_new_session=True,
              )
              ready = False
              deadline = time.time() + 240
              while time.time() < deadline:
                  line = p.stdout.readline()
                  if line:
                      sys.stdout.write(line)
                      log.write(line)
                      if "Done (" in line and "For help" in line:
                          ready = True
                          break
                  elif p.poll() is not None:
                      break
              if not ready:
                  import os, signal
                  try: os.killpg(p.pid, signal.SIGTERM)
                  except ProcessLookupError: pass
                  raise SystemExit("SERVER_WORLD_GENERATION_DID_NOT_REACH_READY")
              # Gradle's runServer task does not forward stdin reliably in CI.
              # Once the server reports Done, the playable world exists; stop the
              # entire launch process group instead of misclassifying SIGTERM as
              # a world-generation failure.
              import os, signal
              time.sleep(2)
              try: os.killpg(p.pid, signal.SIGTERM)
              except ProcessLookupError: pass
              try:
                  p.wait(timeout=20)
              except subprocess.TimeoutExpired:
                  try: os.killpg(p.pid, signal.SIGKILL)
                  except ProcessLookupError: pass
                  p.wait(timeout=10)
          PY

          python3 ../prepare_world.py
          test -f run/world/level.dat
          cp run/logs/latest.log ../server-latest.log
          mkdir -p run/saves
          rm -rf run/saves/CORE_UI_TEST_WORLD
          mv run/world run/saves/CORE_UI_TEST_WORLD
          cp ../core_ui_bridge-0.3.11.jar run/mods/
          # Minecraft 1.21.1 fresh game directories default onboardAccessibility
          # to true, which blocks quick-play behind AccessibilityOnboardingScreen.
          printf 'version:3955\nonboardAccessibility:false\n' > run/options.txt
          echo 'WORLD_READY=PASS' > ../world-generation.txt

      - name: Start protocol-11 renderer peer
        run: |
          set -euo pipefail
          cat > mock_renderer.py <<'PY'
          import socket
          log = open("mock-renderer.log", "w", buffering=1)
          s = socket.socket()
          s.setsockopt(socket.SOL_SOCKET, socket.SO_REUSEADDR, 1)
          s.bind(("127.0.0.1", 37541))
          s.listen(1)
          log.write("LISTENING\n")
          c, a = s.accept()
          log.write("ACCEPT " + repr(a) + "\n")
          c.sendall(b'{"type":"ready","protocol":11,"renderer":"runtime-test"}\n')
          buf = b""
          c.settimeout(300)
          try:
              while True:
                  data = c.recv(65536)
                  if not data:
                      break
                  buf += data
                  while b"\n" in buf:
                      line, buf = buf.split(b"\n", 1)
                      if line:
                          log.write(line.decode("utf-8", "replace") + "\n")
          except Exception as e:
              log.write("SERVER_END " + repr(e) + "\n")
          finally:
              try: c.close()
              except Exception: pass
              s.close()
              log.close()
          PY
          python3 mock_renderer.py &
          echo $! > mock-renderer.pid
          for i in $(seq 1 50); do
            grep -q LISTENING mock-renderer.log 2>/dev/null && exit 0
            sleep .1
          done
          exit 1

      - name: Run real Minecraft client and enter world
        run: |
          set -uo pipefail
          cd mdk
          Xvfb :99 -screen 0 1280x720x24 -ac +extension GLX +render -noreset > ../xvfb.log 2>&1 &
          export DISPLAY=:99
          openbox > ../openbox.log 2>&1 &
          sleep 2
          glxinfo -B > ../glxinfo.txt 2>&1 || true
          timeout 300s ./gradlew --no-daemon runClient --console=plain 2>&1 | tee ../client-console.log
          code=${PIPESTATUS[0]}
          cp run/logs/latest.log ../client-latest.log 2>/dev/null || true
          cp run/CORE_UI_RUNTIME_TRACE.txt ../CORE_UI_RUNTIME_TRACE.txt 2>/dev/null || true
          find /tmp -maxdepth 2 -name core-ui-bridge.log -print -exec cp {} ../core-ui-bridge-diagnostic.log \; 2>/dev/null || true
          echo "RUNCLIENT_EXIT=$code" > ../runtime-result.txt
          exit $code

      - name: Assert in-game runtime behavior
        if: always()
        run: |
          set -euo pipefail
          test -f CORE_UI_RUNTIME_TRACE.txt
          cat CORE_UI_RUNTIME_TRACE.txt

          grep -q '^CORE_UI_LOADED=true$' CORE_UI_RUNTIME_TRACE.txt
          grep -q '^IN_GAME=true$' CORE_UI_RUNTIME_TRACE.txt
          grep -q '^OVERLAY_REPLACEMENT_PASS_CYCLE=10$' CORE_UI_RUNTIME_TRACE.txt
          grep -q '^OVERLAY_REPLACEMENT_PASS_CYCLE=11$' CORE_UI_RUNTIME_TRACE.txt
          grep -q '^FULLSCREEN_OVERLAY_SURVIVED=PASS$' CORE_UI_RUNTIME_TRACE.txt
          grep -q '^WINDOWED_OVERLAY_SURVIVED=PASS$' CORE_UI_RUNTIME_TRACE.txt
          grep -q '^TOTAL_PAUSE_CYCLES=11$' CORE_UI_RUNTIME_TRACE.txt
          grep -q '^CLIENT_RUNTIME_TEST_RESULT PASS$' CORE_UI_RUNTIME_TRACE.txt
          ! grep -q '^CLIENT_RUNTIME_TEST_RESULT FAIL' CORE_UI_RUNTIME_TRACE.txt

          grep -q '"type":"hello","protocol":11' mock-renderer.log

          python3 - <<'PY'
          import json
          pauses = []
          games = []
          with open("mock-renderer.log", encoding="utf-8") as f:
              for raw in f:
                  raw = raw.strip()
                  if not raw.startswith("{"):
                      continue
                  try:
                      obj = json.loads(raw)
                  except Exception:
                      continue
                  if obj.get("type") == "state" and obj.get("screen") == "pause":
                      pauses.append(obj)
                  if obj.get("type") == "state" and obj.get("screen") == "game":
                      games.append(obj)

          print("PAUSE_STATE_COUNT", len(pauses))
          print("GAME_STATE_COUNT", len(games))
          if len(pauses) < 11:
              raise SystemExit("Expected >=11 pause states")
          if len(games) < 11:
              raise SystemExit("Expected >=11 game states")
          for i, obj in enumerate(pauses, 1):
              if int(obj.get("session", 0)) <= 0:
                  raise SystemExit(f"Pause {i} has invalid session: {obj}")
              if int(obj.get("generation", 0)) <= 0:
                  raise SystemExit(f"Pause {i} has invalid generation: {obj}")
          sessions = [int(x["session"]) for x in pauses]
          if any(b <= a for a, b in zip(sessions, sessions[1:])):
              raise SystemExit(f"Pause sessions not strictly increasing: {sessions}")
          print("PROTOCOL_STATE_SEQUENCE=PASS")
          PY

          ! grep -qE 'NoClassDefFoundError|UnsatisfiedLinkError|InvalidMixinException|ExceptionInInitializerError' client-latest.log
          echo 'MINECRAFT_IN_GAME_RUNTIME=PASS' >> runtime-result.txt

          if test -f core-ui-bridge-diagnostic.log; then
            grep -q 'pause-screen-detected' core-ui-bridge-diagnostic.log
            grep -q 'pause-screen-replaced-with-gpu-overlay' core-ui-bridge-diagnostic.log
            grep -q 'begin-pause session=' core-ui-bridge-diagnostic.log
            grep -q 'socket-write.*"screen":"pause"' core-ui-bridge-diagnostic.log
            echo 'DIAGNOSTIC_BOUNDARY=PASS' >> runtime-result.txt
          fi

      - name: Stop renderer peer
        if: always()
        run: |
          if test -f mock-renderer.pid; then
            kill "$(cat mock-renderer.pid)" 2>/dev/null || true
          fi

      - name: Upload runtime evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: core-ui-0311-ingame-runtime-evidence
          if-no-files-found: warn
          path: |
            runtime-result.txt
            world-generation.txt
