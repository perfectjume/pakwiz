name: CORE UI Native Action Router Build

on:
  push:
    branches:
      - core-ui-runtime-smoke
    paths:
      - '.github/workflows/core-ui-action-router-build.yml'

permissions:
  contents: read

jobs:
  build-action-router:
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - name: Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Reconstruct exact tested bridge baseline
        run: |
          set -euo pipefail
          cat core-ui-runtime/core_ui_bridge-0.3.11.jar.b64.part* | base64 -d > core_ui_bridge-0.3.11.jar
          echo 'f398fe1340145c0c4be8a627b4d555729126231d9d61edea7849e6962c9b8a66  core_ui_bridge-0.3.11.jar' | sha256sum -c -
          unzip -t core_ui_bridge-0.3.11.jar

      - name: Prepare exact NeoForge 1.21.1 compile environment
        run: |
          set -euo pipefail
          git clone --depth 1 https://github.com/NeoForgeMDKs/MDK-1.21.1-ModDevGradle.git mdk
          cd mdk
          sed -i 's/^neo_version=.*/neo_version=21.1.250/' gradle.properties
          sed -i 's/^mod_id=.*/mod_id=coreuiroutertest/' gradle.properties
          sed -i 's/^mod_name=.*/mod_name=CORE UI Router Test/' gradle.properties
          sed -i 's/^mod_version=.*/mod_version=1.0.0/' gradle.properties
          sed -i 's/^mod_group_id=.*/mod_group_id=dev.coreui.routertest/' gradle.properties

          mkdir -p libs src/main/java/dev/coreui/bridge
          cp ../core_ui_bridge-0.3.11.jar libs/
          sed -i '/dependencies {/a\    compileOnly files("libs/core_ui_bridge-0.3.11.jar")' build.gradle

          curl -fL -o ../cfr-0.152.jar https://github.com/leibnitz27/cfr/releases/download/0.152/cfr-0.152.jar
          rm -rf ../decompiled
          mkdir -p ../decompiled
          java -jar ../cfr-0.152.jar ../core_ui_bridge-0.3.11.jar --outputdir ../decompiled --silent true

          cp ../decompiled/dev/coreui/bridge/GpuOverlayScreen.java src/main/java/dev/coreui/bridge/GpuOverlayScreen.java
          cp ../decompiled/dev/coreui/bridge/BridgeRuntime.java src/main/java/dev/coreui/bridge/BridgeRuntime.java

          python3 - <<'PY'
          from pathlib import Path

          # Reproduce the already-confirmed 0.3.12 lifecycle patch.
          p = Path("src/main/java/dev/coreui/bridge/GpuOverlayScreen.java")
          s = p.read_text()
          sig = "    public void added() {"
          start = s.find(sig)
          if start < 0:
              raise SystemExit("GPU_OVERLAY_ADDED_METHOD_NOT_FOUND")
          brace = s.find("{", start)
          depth = 0
          end = None
          for i in range(brace, len(s)):
              if s[i] == "{": depth += 1
              elif s[i] == "}":
                  depth -= 1
                  if depth == 0:
                      end = i + 1
                      break
          if end is None:
              raise SystemExit("GPU_OVERLAY_ADDED_METHOD_END_NOT_FOUND")

          replacement = """    public void added() {
              this.openedAtNanos = System.nanoTime();
              this.pointerSyncPending = true;
              this.viewportFrameReady = false;
              this.currentViewportImportAttempted = false;
              this.readyGeneration = 0L;
              this.lastReportedGpuError = null;
          }

          @Override
          protected void init() {
              if (this.sessionId == 0L && this.minecraft != null) {
                  this.lastPixelWidth = this.minecraft.getWindow().getWidth();
                  this.lastPixelHeight = this.minecraft.getWindow().getHeight();
                  this.sessionId = BridgeRuntime.beginPauseSession(this.lastPixelWidth, this.lastPixelHeight);
                  BridgeRuntime.trace("overlay-init begin-pause session=" + this.sessionId + " px=" + this.lastPixelWidth + "x" + this.lastPixelHeight);
              }
          }"""
          s = s[:start] + replacement + s[end:]

          # Split the CFR-created mixed boolean/int local exactly as the green runtime harness does.
          lines = s.splitlines(keepends=True)
          import_index = next((i for i, line in enumerate(lines) if "this.gpu.importFrame(" in line), None)
          if import_index is None:
              raise SystemExit("GPU_OVERLAY_IMPORTFRAME_ASSIGNMENT_NOT_FOUND")
          original_line = lines[import_index]
          lhs, rhs = original_line.split("=", 1)
          oldvar = lhs.strip().split()[-1]
          indent = original_line[:len(original_line) - len(original_line.lstrip())]
          lines[import_index] = indent + "boolean importOk = " + rhs.lstrip()
          draw_index = next((i for i in range(import_index + 1, len(lines)) if "this.gpu.beginDraw()" in lines[i]), None)
          if draw_index is None:
              raise SystemExit("GPU_OVERLAY_BEGINDRAW_ASSIGNMENT_NOT_FOUND")
          for i in range(import_index + 1, draw_index):
              lines[i] = lines[i].replace(oldvar, "importOk")
              lines[i] = lines[i].replace("importOk != 0", "importOk")
              lines[i] = lines[i].replace("importOk == 0", "!importOk")
          p.write_text("".join(lines))

          # Extend only the renderer action lambda. All socket/session/frame logic stays unchanged.
          p = Path("src/main/java/dev/coreui/bridge/BridgeRuntime.java")
          s = p.read_text()
          marker = "lambda$handleRendererLine$2"
          start = s.find(marker)
          if start < 0:
              raise SystemExit("BRIDGE_ACTION_LAMBDA_NOT_FOUND")
          start = s.rfind("    ", 0, start)
          brace = s.find("{", start)
          depth = 0
          end = None
          for i in range(brace, len(s)):
              if s[i] == "{": depth += 1
              elif s[i] == "}":
                  depth -= 1
                  if depth == 0:
                      end = i + 1
                      break
          if end is None:
              raise SystemExit("BRIDGE_ACTION_LAMBDA_END_NOT_FOUND")

          replacement = """    private static void lambda$handleRendererLine$2(long session, long generation, String action, net.minecraft.client.Minecraft minecraft) {
              if (!BridgeRuntime.isActive(session, generation)) {
                  return;
              }
              if (!(minecraft.screen instanceof GpuOverlayScreen)) {
                  return;
              }

              net.minecraft.client.gui.screens.Screen parent = minecraft.screen;
              switch (action) {
                  case "resume" -> minecraft.setScreen(null);
                  case "quit" -> minecraft.stop();
                  case "options" -> minecraft.setScreen(
                      new net.minecraft.client.gui.screens.options.OptionsScreen(parent, minecraft.options)
                  );
                  case "advancements" -> {
                      if (minecraft.player != null) {
                          minecraft.setScreen(
                              new net.minecraft.client.gui.screens.advancements.AdvancementsScreen(
                                  minecraft.player.connection.getAdvancements(),
                                  parent
                              )
                          );
                      }
                  }
                  case "statistics" -> {
                      if (minecraft.player != null) {
                          minecraft.setScreen(
                              new net.minecraft.client.gui.screens.achievement.StatsScreen(
                                  parent,
                                  minecraft.player.getStats()
                              )
                          );
                      }
                  }
                  default -> BridgeRuntime.trace("ignored unsupported renderer action=" + action);
              }
          }"""
          s = s[:start] + replacement + s[end:]
          p.write_text(s)
          print("ACTION_ROUTER_PATCH=APPLIED")
          PY

          cat > src/main/java/dev/coreui/bridge/CoreUiBridge.java <<'JAVA'
          package dev.coreui.bridge;

          import net.minecraft.client.gui.screens.PauseScreen;
          import net.minecraft.client.gui.screens.Screen;
          import net.neoforged.api.distmarker.Dist;
          import net.neoforged.fml.common.Mod;
          import net.neoforged.neoforge.client.event.ScreenEvent;
          import net.neoforged.neoforge.common.NeoForge;

          @Mod(value = CoreUiBridge.MOD_ID, dist = Dist.CLIENT)
          public final class CoreUiBridge {
              public static final String MOD_ID = "core_ui_bridge";

              public CoreUiBridge() {
                  BridgeRuntime.start();
                  NeoForge.EVENT_BUS.addListener(this::onScreenOpening);
              }

              private void onScreenOpening(ScreenEvent.Opening event) {
                  Screen next = event.getNewScreen();
                  boolean connected = BridgeRuntime.isConnected();
                  BridgeRuntime.trace("screen-opening new=" + (next == null ? "null" : next.getClass().getName()) + " connected=" + connected);
                  if (!connected) {
                      BridgeRuntime.trace("screen-opening passthrough reason=transport-disconnected");
                      return;
                  }
                  if (next instanceof PauseScreen pause) {
                      boolean showsPauseMenu = pause.showsPauseMenu();
                      BridgeRuntime.trace("pause-screen-detected showsPauseMenu=" + showsPauseMenu);
                      if (showsPauseMenu) {
                          event.setNewScreen(new GpuOverlayScreen());
                          BridgeRuntime.trace("pause-screen-replaced-with-gpu-overlay");
                      }
                  }
              }
          }
          JAVA

          chmod +x gradlew
          ./gradlew --no-daemon compileJava

          javap -classpath build/classes/java/main -c -p dev.coreui.bridge.BridgeRuntime | tee ../BridgeRuntime-router.javap.txt
          grep -F 'OptionsScreen' ../BridgeRuntime-router.javap.txt
          grep -F 'AdvancementsScreen' ../BridgeRuntime-router.javap.txt
          grep -F 'StatsScreen' ../BridgeRuntime-router.javap.txt
          grep -F 'getStats' ../BridgeRuntime-router.javap.txt
          grep -F 'getAdvancements' ../BridgeRuntime-router.javap.txt

          mkdir -p ../patch/dev/coreui/bridge
          cp build/classes/java/main/dev/coreui/bridge/CoreUiBridge.class ../patch/dev/coreui/bridge/
          cp build/classes/java/main/dev/coreui/bridge/GpuOverlayScreen.class ../patch/dev/coreui/bridge/
          cp build/classes/java/main/dev/coreui/bridge/BridgeRuntime.class ../patch/dev/coreui/bridge/

          cp ../core_ui_bridge-0.3.11.jar ../core_ui_bridge-action-router.jar
          (cd ../patch && zip -q -u ../core_ui_bridge-action-router.jar dev/coreui/bridge/CoreUiBridge.class dev/coreui/bridge/GpuOverlayScreen.class dev/coreui/bridge/BridgeRuntime.class)
          unzip -t ../core_ui_bridge-action-router.jar
          sha256sum ../core_ui_bridge-action-router.jar | tee ../action-router-sha256.txt

      - name: Upload build evidence
        uses: actions/upload-artifact@v4
        with:
          name: core-ui-action-router-build
          path: |
            core_ui_bridge-action-router.jar
            action-router-sha256.txt
            BridgeRuntime-router.javap.txt
            mdk/src/main/java/dev/coreui/bridge/BridgeRuntime.java
            mdk/src/main/java/dev/coreui/bridge/GpuOverlayScreen.java
