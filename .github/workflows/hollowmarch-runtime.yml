name: Hollowmarch C2ME Controlled Runtime Test

on:
  push:
    branches:
      - chatgpt-hollowmarch-runtime-20260928
    paths:
      - '.github/workflows/hollowmarch-runtime.yml'
      - '.runtime/**'

permissions:
  contents: read

jobs:
  runtime:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - name: Download exact runtime artifacts
        shell: bash
        run: |
          set -euo pipefail
          curl -fL --retry 5 --retry-delay 2 \
            -o neoforge-21.1.250-installer.jar \
            https://maven.neoforged.net/releases/net/neoforged/neoforge/21.1.250/neoforge-21.1.250-installer.jar

          python3 - <<'PY'
          import json, urllib.request
          versions = {
              "c2me.jar": "kvrPcTsz",
              "hollowmarch.jar": "nzAPF4pb",
              "geckolib.jar": "tPkJmim6",
              "create.jar": "UjX6dr61",
          }
          for out, version_id in versions.items():
              with urllib.request.urlopen(f"https://api.modrinth.com/v2/version/{version_id}") as r:
                  meta = json.load(r)
              files = meta["files"]
              primary = next((f for f in files if f.get("primary")), files[0])
              urllib.request.urlretrieve(primary["url"], out)
              print(out, primary["filename"])
          PY

          echo 'f06c116c1b447a2cdb3162d6c9ec54c9a422b48d  c2me.jar' | sha1sum -c -
          base64 -d .runtime/hollowmarch-c2me-fix-v2.jar.b64 > hollowmarch-c2me-fix-v2.jar
          echo '69a7d4f590910e690b1d9cb2bdf63f51a21d76cefb597fcd95fde6fe75c36172  hollowmarch-c2me-fix-v2.jar' | sha256sum -c -
          java -version

      - name: Verify exact Hollowmarch target class
        shell: bash
        run: |
          set -euo pipefail
          unzip -p hollowmarch.jar \
            com/overyourhead/hollowmarch/common/worldgen/structure/PiratesFallMobEvents.class \
            > PiratesFallMobEvents.class
          ACTUAL="$(sha256sum PiratesFallMobEvents.class | awk '{print $1}')"
          EXPECTED='0953b403b525c5fbff96892d3ebbb70ff3804790380ed484fadb58aad7245df4'
          echo "target_class_sha256=$ACTUAL"
          test "$ACTUAL" = "$EXPECTED"

      - name: Install exact NeoForge dedicated server
        shell: bash
        run: |
          set -euo pipefail
          mkdir server
          cd server
          java -jar ../neoforge-21.1.250-installer.jar --installServer
          printf 'eula=true\n' > eula.txt

          cat > user_jvm_args.txt <<'EOF'
          -Xms1G
          -Xmx4G
          -Dmixin.debug.export=true
          -Dmixin.debug.verbose=true
          EOF

          cat > server.properties <<'EOF'
          online-mode=false
          enforce-secure-profile=false
          view-distance=6
          simulation-distance=6
          max-tick-time=-1
          allow-flight=true
          spawn-protection=0
          sync-chunk-writes=true
          motd=Hollowmarch C2ME controlled runtime test
          EOF

          mkdir mods
          cp ../c2me.jar ../hollowmarch.jar ../geckolib.jar ../create.jar ../hollowmarch-c2me-fix-v2.jar mods/
          chmod +x run.sh

      - name: Run controlled real-server chunk workload
        shell: bash
        run: |
          set -euo pipefail
          cd server
          rm -f server.in
          mkfifo server.in
          exec 3<>server.in

          ./run.sh nogui < server.in > ../patched.log 2>&1 &
          pid=$!

          ready=0
          for i in $(seq 1 240); do
            if grep -Fq 'Done (' ../patched.log 2>/dev/null; then
              ready=1
              break
            fi
            if ! kill -0 "$pid" 2>/dev/null; then
              break
            fi
            sleep 1
          done

          echo "ready=$ready" | tee ../patched.status
          test "$ready" -eq 1

          # /forceload takes BLOCK coordinates. A 128x128-block rectangle is
          # exactly 8x8 chunks = 64 chunks. Eight separated batches therefore
          # generate 512 distinct chunks while keeping only one 64-chunk batch
          # force-loaded at a time.
          for batch in $(seq 0 7); do
            x=$((8192 + batch * 256))
            z=8192
            echo "forceload add $x $z $((x+127)) $((z+127))" >&3
            sleep 6

            if ! kill -0 "$pid" 2>/dev/null; then
              echo "process_died_during_batch=$batch" | tee -a ../patched.status
              break
            fi

            if grep -Fq 'because "this.wrapped" is null' ../patched.log; then
              echo "wrapped_npe_seen_during_batch=$batch" | tee -a ../patched.status
              break
            fi

            echo "forceload remove all" >&3
            sleep 3
          done

          # Hollowmarch uses a 120-tick pending countdown; keep the real server
          # ticking well beyond six seconds after the final generated chunks.
          sleep 30

          alive_before_stop=0
          if kill -0 "$pid" 2>/dev/null; then
            alive_before_stop=1
            echo "save-all flush" >&3
            sleep 5
            echo "stop" >&3
          fi
          echo "alive_before_stop=$alive_before_stop" | tee -a ../patched.status
          exec 3>&-

          for i in $(seq 1 90); do
            if ! kill -0 "$pid" 2>/dev/null; then
              break
            fi
            sleep 1
          done

          if kill -0 "$pid" 2>/dev/null; then
            echo "clean_shutdown=0" | tee -a ../patched.status
            kill "$pid" 2>/dev/null || true
            sleep 2
            kill -9 "$pid" 2>/dev/null || true
          else
            echo "clean_shutdown=1" | tee -a ../patched.status
          fi
          wait "$pid" || true

          cd ..
          grep -Fq 'because "this.wrapped" is null' patched.log && echo 'wrapped_npe=1' | tee -a patched.status || echo 'wrapped_npe=0' | tee -a patched.status
          grep -Fq 'PiratesFallMobEvents.onLevelTick(PiratesFallMobEvents.java:72)' patched.log && echo 'original_line72_crash=1' | tee -a patched.status || echo 'original_line72_crash=0' | tee -a patched.status
          grep -Eq 'MixinApplyError|InvalidMixinException|InjectionError|Critical injection failure' patched.log && echo 'mixin_error=1' | tee -a patched.status || echo 'mixin_error=0' | tee -a patched.status
          grep -Fq 'Encountered an unexpected exception' patched.log && echo 'unexpected_server_exception=1' | tee -a patched.status || echo 'unexpected_server_exception=0' | tee -a patched.status

          grep -Fq 'ready=1' patched.status
          grep -Fq 'alive_before_stop=1' patched.status
          grep -Fq 'clean_shutdown=1' patched.status
          grep -Fq 'wrapped_npe=0' patched.status
          grep -Fq 'original_line72_crash=0' patched.status
          grep -Fq 'mixin_error=0' patched.status
          grep -Fq 'unexpected_server_exception=0' patched.status

      - name: Verify live Mixin transformation
        shell: bash
        run: |
          set -euo pipefail
          find server -type f -path '*mixin.out*PiratesFallMobEvents*.class' -print | tee transformed-files.txt
          TARGET="$(find server -type f -path '*mixin.out*PiratesFallMobEvents.class' | head -n 1)"
          test -n "$TARGET"
          javap -p "$TARGET" > transformed-javap.txt
          grep -F 'hollowmarchC2MEFix$stagePendingMutation' transformed-javap.txt
          grep -F 'hollowmarchC2MEFix$drainStagedBeforeIteration' transformed-javap.txt
          cat patched.status

      - name: Upload controlled runtime evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hollowmarch-c2me-controlled-runtime-evidence
          if-no-files-found: warn
          path: |
            patched.log
            patched.status
            transformed-files.txt
            transformed-javap.txt
            server/crash-reports/
